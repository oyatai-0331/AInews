name: "Research Agent (Claude primary, OpenAI fallback)"
description: >
  Run one schema-constrained agent turn and return its JSON as `structured_output`.
  MAIN is Claude (anthropics/claude-code-action); the SUB is the OpenAI
  Responses API with web search, used ONLY when no Claude credential is present
  but an OpenAI API key is. Either way the caller gets the same
  `structured_output` JSON string, so the deterministic Python publishers don't
  care which engine produced it.

inputs:
  prompt:
    description: The task prompt (written Claude-style; OpenAI follows it too).
    required: true
  json-schema:
    description: >
      Bare JSON Schema string the output must conform to. Pass it WITHOUT
      surrounding quotes; this action quotes it for Claude's --json-schema and
      embeds it in the OpenAI fallback prompt as the output contract.
    required: true
  allowed-tools:
    description: Claude allowedTools list (e.g. "WebSearch,WebFetch,Read").
    required: false
    default: "WebSearch,WebFetch,Read"
  max-turns:
    description: Max agent turns.
    required: false
    default: "30"
  web-search:
    description: >
      "true" enables the OpenAI web_search tool for the OpenAI fallback. Set
      "false" for read-only jobs such as the domain picker.
    required: false
    default: "true"
  anthropic-model:
    description: Model id for the Claude main.
    required: false
    default: "claude-sonnet-4-6"
  openai-model:
    description: Model id for the OpenAI fallback. Empty uses gpt-5-mini.
    required: false
    default: ""
  claude-code-oauth-token:
    description: secrets.CLAUDE_CODE_OAUTH_TOKEN (Claude Pro/Max plan token).
    required: false
    default: ""
  anthropic-api-key:
    description: secrets.ANTHROPIC_API_KEY.
    required: false
    default: ""
  openai-api-key:
    description: secrets.OPENAI_API_KEY.
    required: false
    default: ""
outputs:
  structured_output:
    description: The agent's JSON object as a string (empty if no credential).
    value: ${{ steps.claude.outputs.structured_output || steps.openai.outputs.json }}

runs:
  using: composite
  steps:
    # Decide which engine to use. Claude wins whenever a Claude credential is
    # present; OpenAI Responses is the sub, reached only as a fallback.
    - name: Pick engine (Claude main → OpenAI sub)
      id: engine
      shell: bash
      env:
        A: ${{ inputs.anthropic-api-key }}
        O: ${{ inputs.claude-code-oauth-token }}
        P: ${{ inputs.openai-api-key }}
      run: |
        if [ -n "$A" ] || [ -n "$O" ]; then
          echo "engine=claude" >> "$GITHUB_OUTPUT"
        elif [ -n "$P" ]; then
          echo "engine=openai" >> "$GITHUB_OUTPUT"
          echo "::notice title=Research Agent::No Claude credential — falling back to OpenAI Responses with web search."
        else
          echo "engine=none" >> "$GITHUB_OUTPUT"
        fi

    # MAIN: Claude Code Action. Returns a clean, schema-validated structured_output.
    - name: Run main (Claude Code)
      id: claude
      if: ${{ steps.engine.outputs.engine == 'claude' }}
      uses: anthropics/claude-code-action@v1
      with:
        claude_code_oauth_token: ${{ inputs.claude-code-oauth-token }}
        anthropic_api_key: ${{ inputs.anthropic-api-key }}
        prompt: ${{ inputs.prompt }}
        claude_args: |
          --allowedTools ${{ inputs.allowed-tools }}
          --max-turns ${{ inputs.max-turns }}
          --model ${{ inputs.anthropic-model }}
          --json-schema '${{ inputs.json-schema }}'

    # SUB: OpenAI Responses API. Uses the built-in web_search tool when the
    # caller asks for live research, and Structured Outputs for schema-shaped JSON.
    - name: Run sub (OpenAI Responses)
      id: openai
      if: ${{ steps.engine.outputs.engine == 'openai' }}
      shell: bash
      env:
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        OPENAI_MODEL: ${{ inputs.openai-model }}
        WEB_SEARCH: ${{ inputs.web-search }}
        JSON_SCHEMA: ${{ inputs.json-schema }}
        AGENT_PROMPT: ${{ inputs.prompt }}
      run: python3 scripts/openai_responses_agent.py
